# Point Valuation Model Configuration
point_valuation_model:
  model_type: xgboost
  hyperparameters:
    max_depth: 6
    learning_rate: 0.1
    n_estimators: 100
    min_child_weight: 1
    gamma: 0
    subsample: 0.8
    colsample_bytree: 0.8
    objective: 'reg:squarederror'
    random_state: 42
  
  features:
    - spending_by_category
    - historical_redemptions
    - card_portfolio_size
    - average_transaction_amount
    - redemption_frequency
    - point_balance
  
  target: point_valuation

# ── Personalization Model (Epic 3, Stories 3.1–3.4) ──────────────────
personalization:
  target_column: estimated_point_value
  random_seed: 42

  splits:
    train_size: 0.70
    val_size: 0.15
    test_size: 0.15
    stratify_by: budget_quartile

  feature_groups:
    user_numeric:
      - monthly_budget
      - annual_budget
      - num_cards
      - monthly_budget_log
      - age_group_ordinal
    transaction_numeric:
      - total_spending
      - total_transactions
      - avg_transaction_amount
      - median_transaction_amount
      - transaction_amount_std
      - spending_diversity
      - weekend_spending_ratio
      - card_switch_rate
      - num_cards_used
      - num_unique_mccs
      - num_unique_merchants
      - repeat_merchant_ratio
    onehot_prefixes:
      - archetype_
      - age_
      - location_
      - redemption_
      - budget_

  baselines:
    - mean
    - random_forest
    - xgboost

  tuning:
    n_trials: 50
    cv_folds: 5
    metric: rmse
    search_space:
      max_depth: [3, 10]
      learning_rate: [0.01, 0.3]
      n_estimators: [50, 500]
      min_child_weight: [1, 10]
      gamma: [0.0, 1.0]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

# Recommendation Engine Configuration
recommendation_engine:
  reward_calculator:
    consider_annual_fee: true
    include_welcome_bonus: true
    amortize_bonus_over_months: 12
    cap_tracking_enabled: true
  
  portfolio_optimizer:
    optimization_method: pulp
    objective: maximize_net_value
    constraints:
      - max_annual_fee_total: 1000
      - min_cards: 1
      - max_cards: 5

# Habit Detection Configuration
habit_detection:
  clustering_method: dbscan
  eps: 0.5
  min_samples: 5
  merchant_frequency_threshold: 5
  time_window_days: 90

# Model Monitoring
monitoring:
  data_drift:
    method: evidently
    threshold: 0.15
    reference_window_days: 30
  
  prediction_drift:
    threshold: 0.10
    alert_on_drift: true
  
  performance_degradation:
    metric: mape
    threshold: 0.05
    trigger_retraining: true
