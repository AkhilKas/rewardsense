services:
  - type: web
    name: rewardsense-api
    runtime: docker
    dockerfilePath: ./Dockerfile.serving
    healthCheckPath: /health
    envVars:
      - key: MODEL_LOCAL_PATH
        value: /app/models/personalization.joblib
      - key: MODEL_LOAD_REQUIRED
        value: false
      - key: ENABLE_LLM_EXPLANATIONS
        value: false
      - key: UVICORN_WORKERS
        value: 1
      - key: CORS_ORIGINS
        sync: false
