name: Serving Redeploy

# Triggered by the model pipeline DAG after a new Production model is
# registered in MLflow.  Can also be dispatched manually from the
# GitHub Actions UI.
#
# Required GitHub secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_SERVICE_ACCOUNT
#   SLACK_WEBHOOK_URL
#
# Required Airflow Variables (used by the DAG trigger task):
#   GITHUB_TOKEN  — PAT with `workflow` scope
#   GITHUB_OWNER  — repo owner (default: Raul2008NEU)
#   GITHUB_REPO   — repo name  (default: rewardsense)

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'What triggered this redeployment'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - model_pipeline
          - retrain_pipeline

jobs:
  rollout:
    name: "Rollout: Redeploy Serving Container"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: rewardsense-serving
      REGION: us-central1
      PROJECT: rewardsense
      # Always redeploy the latest pushed image; model is loaded from MLflow at startup
      IMAGE: us-central1-docker.pkg.dev/rewardsense/rewardsense-docker/serving:latest
      TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}

    steps:
    - name: Log trigger source
      run: |
        echo "::notice::Redeployment triggered by: $TRIGGER_SOURCE"
        echo "Triggered at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Capture current stable revision
      id: current
      run: |
        CURRENT=$(gcloud run services describe "$SERVICE" \
          --region="$REGION" --project="$PROJECT" \
          --format="value(status.traffic[0].revisionName)")
        echo "revision=$CURRENT" >> "$GITHUB_OUTPUT"
        echo "Current stable revision: $CURRENT"

    - name: Deploy new revision with no traffic
      id: new_revision
      run: |
        gcloud run deploy "$SERVICE" \
          --image="$IMAGE" \
          --region="$REGION" \
          --project="$PROJECT" \
          --no-traffic \
          --update-env-vars="DEPLOY_TRIGGER=$TRIGGER_SOURCE,DEPLOY_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          --quiet
        NEW=$(gcloud run services describe "$SERVICE" \
          --region="$REGION" --project="$PROJECT" \
          --format="value(status.latestCreatedRevisionName)")
        echo "revision=$NEW" >> "$GITHUB_OUTPUT"
        echo "New revision: $NEW"

    - name: Wait for new revision to become healthy (60s)
      id: health_check
      run: |
        REVISION="${{ steps.new_revision.outputs.revision }}"
        echo "Polling health for revision: $REVISION"
        for i in $(seq 1 12); do
          STATUS=$(gcloud run revisions describe "$REVISION" \
            --region="$REGION" --project="$PROJECT" \
            --format="json" \
            | python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        conditions = data.get('status', {}).get('conditions', [])
        ready = next((c for c in conditions if c.get('type') == 'Ready'), {})
        print(ready.get('status', 'Unknown'))
        " 2>/dev/null || echo "Unknown")
          echo "Attempt $i/12: Ready=$STATUS"
          [ "$STATUS" = "True" ] && exit 0
          [ "$STATUS" = "False" ] && { echo "Revision failed to start."; exit 1; }
          sleep 5
        done
        echo "Timed out waiting for revision to become healthy."
        exit 1

    - name: Switch 100% traffic to new revision
      if: success()
      run: |
        gcloud run services update-traffic "$SERVICE" \
          --region="$REGION" --project="$PROJECT" \
          --to-revisions="${{ steps.new_revision.outputs.revision }}=100"
        echo "Traffic switched to ${{ steps.new_revision.outputs.revision }}"

    - name: Rollback traffic to previous revision
      if: failure() && steps.new_revision.outcome == 'success'
      run: |
        PREVIOUS="${{ steps.current.outputs.revision }}"
        echo "Health check failed — keeping traffic on $PREVIOUS"
        gcloud run services update-traffic "$SERVICE" \
          --region="$REGION" --project="$PROJECT" \
          --to-revisions="$PREVIOUS=100"

    - name: Notify Slack on success
      if: success()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        if [ -z "$SLACK_WEBHOOK_URL" ]; then
          echo "SLACK_WEBHOOK_URL not configured — skipping notification."
          exit 0
        fi
        curl -s -X POST "$SLACK_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "{
            \"text\": \":arrows_counterclockwise: *RewardSense serving redeployed*\n• Trigger: \`$TRIGGER_SOURCE\`\n• Revision: \`${{ steps.new_revision.outputs.revision }}\`\n• Image: \`$IMAGE\`\"
          }"
