name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==================================================================
  # 1. Path Filtering - Detect what changed
  # ==================================================================
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.filter.outputs.model }}
      data: ${{ steps.filter.outputs.data }}
    steps:
    - uses: actions/checkout@v3
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          model:
            - 'src/model_pipeline/**'
            - 'tests/model_pipeline/**'
            - 'requirements-model.txt'
            - 'Dockerfile.model'
          data:
            - 'src/data_pipeline/**'
            - 'tests/data_pipeline/**'
            - 'dags/**'
            - 'requirements-ci.txt'

  # ==================================================================
  # 2. Data Pipeline - Unit & Integration Tests
  # ==================================================================
  test:
    name: "Test: Data Pipeline"
    needs: changes
    # Run if data changes OR if it's a push to main/develop (always run on main)
    if: needs.changes.outputs.data == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11"]
    
    env:
      PYTHONPATH: . # Support "from src.data_pipeline" imports in existing tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-data-${{ hashFiles('requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-data-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt 
        pip install -e .
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/
    
    - name: Format check with black
      run: |
        black --check src/ tests/
    
    - name: Run data pipeline tests
      run: |
        # Override pytest.ini addopts to prevent global coverage threshold from failing the partial run
        pytest tests/data_pipeline/ tests/dags/ tests/schemas/ \
          --override-ini="addopts=" \
          --cov=src/data_pipeline \
          --cov-report=xml:coverage-data.xml \
          --cov-report=term-missing \
          --cov-fail-under=75
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage-data.xml
        flags: data-pipeline
        fail_ci_if_error: false

  # ==================================================================
  # 3. Model Pipeline - ML Environment Tests
  # ==================================================================
  model-test:
    name: "Test: Model Pipeline"
    needs: changes
    if: needs.changes.outputs.model == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9]
    
    env:
      PYTHONPATH: .
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-model-${{ hashFiles('requirements-model.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-model-
    
    - name: Install ML dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-model.txt
        pip install -e .
    
    - name: Run model pipeline tests
      run: |
        # Override pytest.ini addopts to prevent global coverage threshold from failing the partial run
        pytest tests/model_pipeline/ \
          --override-ini="addopts=" \
          --cov=src/model_pipeline \
          --cov-report=xml:coverage-model.xml \
          --cov-report=term-missing \
          --cov-fail-under=75
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage-model.xml
        flags: model-pipeline
        fail_ci_if_error: false

  # ==================================================================
  # 4. Model Build - Docker Verification
  # ==================================================================
  model-build:
    name: "Build: Model Docker Image"
    needs: [changes, model-test]
    if: needs.changes.outputs.model == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Model Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.model
        push: false
        tags: rewardsense-model:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
