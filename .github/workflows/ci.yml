name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ==================================================================
  # 1. Path Filtering - Detect what changed
  # ==================================================================
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      model: ${{ steps.filter.outputs.model }}
      data: ${{ steps.filter.outputs.data }}
    steps:
    - uses: actions/checkout@v3
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          model:
            - 'src/model_pipeline/**'
            - 'tests/model_pipeline/**'
            - 'requirements-model.txt'
            - 'Dockerfile.model'
          data:
            - 'src/data_pipeline/**'
            - 'tests/data_pipeline/**'
            - 'dags/**'
            - 'requirements-ci.txt'

  # ==================================================================
  # 2. Data Pipeline - Unit & Integration Tests
  # ==================================================================
  test:
    name: "Test: Data Pipeline"
    needs: changes
    # Run if data changes OR if it's a push to main/develop (always run on main)
    if: needs.changes.outputs.data == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    env:
      PYTHONPATH: . # Support "from src.data_pipeline" imports in existing tests
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-data-${{ hashFiles('requirements-ci.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-data-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt 
        pip install -e .
    
    - name: Lint with ruff
      run: |
        ruff check src/ tests/
    
    - name: Format check with black
      run: |
        black --check src/ tests/
    
    - name: Run data pipeline tests
      run: |
        # Override pytest.ini addopts to prevent global coverage threshold from failing the partial run
        pytest tests/data_pipeline/ tests/dags/ tests/schemas/ \
          --override-ini="addopts=" \
          --cov=src/data_pipeline \
          --cov-report=xml:coverage-data.xml \
          --cov-report=term-missing \
          --cov-fail-under=75
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage-data.xml
        flags: data-pipeline
        fail_ci_if_error: false

  # ==================================================================
  # 3. Model Pipeline - ML Environment Tests
  # ==================================================================
  model-test:
    name: "Test: Model Pipeline"
    needs: changes
    if: needs.changes.outputs.model == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    
    env:
      PYTHONPATH: .
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-model-${{ hashFiles('requirements-model.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-model-
    
    - name: Install ML dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-model.txt
        pip install ruff mypy
        pip install -e .

    - name: Lint model pipeline with ruff
      run: |
        ruff check src/model_pipeline tests/model_pipeline

    - name: Type check model pipeline with mypy
      run: |
        python -m mypy src/model_pipeline --ignore-missing-imports --disable-error-code import-untyped
    
    - name: Run model pipeline tests
      run: |
        # Override pytest.ini addopts to prevent global coverage threshold from failing the partial run
        pytest tests/model_pipeline/ \
          --override-ini="addopts=" \
          --cov=src/model_pipeline \
          --cov-report=xml:coverage-model.xml \
          --cov-report=term-missing \
          --cov-fail-under=80
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage-model.xml
        flags: model-pipeline
        fail_ci_if_error: false

  # ==================================================================
  # 4. Deploy — Build & Push Serving Container to Artifact Registry
  # Story 3.1: Runs on merge to main after all tests pass.
  # ==================================================================
  deploy:
    name: "Deploy: Build & Push Serving Container"
    needs: [test, model-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: us-central1-docker.pkg.dev/rewardsense/rewardsense-docker/serving:${{ github.sha }}

    steps:
    - uses: actions/checkout@v3

    - name: Authenticate to GCP
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build and push serving image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.serving
        push: true
        tags: |
          us-central1-docker.pkg.dev/rewardsense/rewardsense-docker/serving:${{ github.sha }}
          us-central1-docker.pkg.dev/rewardsense/rewardsense-docker/serving:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==================================================================
  # 5. Rollout — Deploy to Cloud Run with traffic switching & rollback
  # Story 3.2: Runs after serving container is pushed to Artifact Registry.
  # ==================================================================
  rollout:
    name: "Rollout: Deploy to Cloud Run"
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: rewardsense-serving
      REGION: us-central1
      PROJECT: rewardsense
      IMAGE: ${{ needs.deploy.outputs.image }}

    steps:
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Capture current stable revision
      id: current
      run: |
        CURRENT=$(gcloud run services describe "$SERVICE" \
          --region="$REGION" --project="$PROJECT" \
          --format="value(status.traffic[0].revisionName)")
        echo "revision=$CURRENT" >> "$GITHUB_OUTPUT"
        echo "Current stable revision: $CURRENT"

    - name: Deploy new revision with no traffic
      id: new_revision
      run: |
        gcloud run deploy "$SERVICE" \
          --image="$IMAGE" \
          --region="$REGION" \
          --project="$PROJECT" \
          --no-traffic \
          --quiet
        NEW=$(gcloud run services describe "$SERVICE" \
          --region="$REGION" --project="$PROJECT" \
          --format="value(status.latestCreatedRevisionName)")
        echo "revision=$NEW" >> "$GITHUB_OUTPUT"
        echo "New revision: $NEW"

    - name: Wait for new revision to become healthy (60s)
      id: health_check
      run: |
        REVISION="${{ steps.new_revision.outputs.revision }}"
        echo "Polling health for revision: $REVISION"
        for i in $(seq 1 12); do
          STATUS=$(gcloud run revisions describe "$REVISION" \
            --region="$REGION" --project="$PROJECT" \
            --format="json" \
            | python3 -c "
        import sys, json
        data = json.load(sys.stdin)
        conditions = data.get('status', {}).get('conditions', [])
        ready = next((c for c in conditions if c.get('type') == 'Ready'), {})
        print(ready.get('status', 'Unknown'))
        " 2>/dev/null || echo "Unknown")
          echo "Attempt $i/12: Ready=$STATUS"
          [ "$STATUS" = "True" ] && exit 0
          [ "$STATUS" = "False" ] && { echo "Revision failed to start."; exit 1; }
          sleep 5
        done
        echo "Timed out waiting for revision to become healthy."
        exit 1

    - name: Switch 100% traffic to new revision
      if: success()
      run: |
        gcloud run services update-traffic "$SERVICE" \
          --region="$REGION" --project="$PROJECT" \
          --to-revisions="${{ steps.new_revision.outputs.revision }}=100"
        echo "Traffic switched to ${{ steps.new_revision.outputs.revision }}"

    - name: Rollback traffic to previous revision
      if: failure() && steps.new_revision.outcome == 'success'
      run: |
        PREVIOUS="${{ steps.current.outputs.revision }}"
        echo "Health check failed — keeping traffic on $PREVIOUS"
        gcloud run services update-traffic "$SERVICE" \
          --region="$REGION" --project="$PROJECT" \
          --to-revisions="$PREVIOUS=100"

    - name: Notify Slack on success
      if: success()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
        curl -s -X POST "$SLACK_WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d "{
            \"text\": \":rocket: *RewardSense serving deployed*\n• Revision: \`${{ steps.new_revision.outputs.revision }}\`\n• Commit: \`${{ github.sha }}\`\n• Image: \`$IMAGE\`\"
          }"

  # ==================================================================
  # 6. Serving Smoke Test — post-deploy integration check
  # Runs after rollout completes and traffic is switched.
  # ==================================================================
  serving-smoke-test:
    name: "Smoke Test: Serving API"
    needs: [rollout]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      SERVING_URL: ${{ vars.SERVING_URL || 'https://rewardsense-serving-760934308287.us-central1.run.app' }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install smoke test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytest pyyaml

    - name: Run serving smoke tests
      run: |
        pytest tests/integration/test_serving_deployment.py \
          -m integration \
          -v \
          --tb=short \
          --override-ini="addopts="
      env:
        SERVING_URL: ${{ env.SERVING_URL }}

    - name: Notify on smoke test failure
      if: failure()
      run: |
        echo "::error::Serving smoke test failed for $SERVING_URL — check Cloud Run logs."

  # ==================================================================
  # 7. Model Build - Docker Verification
  # ==================================================================
  model-build:
    name: "Build: Model Docker Image"
    needs: [changes, model-test]
    if: needs.changes.outputs.model == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Model Image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.model
        push: false
        tags: rewardsense-model:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
