name: DVC Version Commit

on:
  workflow_dispatch:
    inputs:
      dag_run_id:
        description: Airflow DAG Run ID (for logging)
        required: false
        default: manual
  repository_dispatch:
    types: [dvc-commit]

env:
  PYTHON_VERSION: "3.10"

jobs:
  commit-dvc-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install DVC with GCS support
        run: pip install dvc

      - name: Commit and push DVC files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A "*.dvc" dvc.lock .gitignore .dvc/ 2>/dev/null || true

          RUN_ID="${{ github.event.inputs.dag_run_id || github.event.client_payload.dag_run_id || 'unknown' }}"
          TIMESTAMP="$(date -u +"%Y-%m-%d %H:%M UTC")"

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(data): auto-update DVC tracking files

Run ID: ${RUN_ID}
Timestamp: ${TIMESTAMP}
Triggered by: ${{ github.event_name }}

[skip ci]"
            git push
            echo "Committed and pushed DVC tracking updates"
          fi

      - name: Summary
        run: |
          echo "## DVC Version Commit Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Trigger: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run ID: ${{ github.event.inputs.dag_run_id || github.event.client_payload.dag_run_id || 'N/A' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Complete" >> "$GITHUB_STEP_SUMMARY"
