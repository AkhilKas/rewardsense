name: DVC Version Commit

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'dvc.lock'
      - '*.dvc'
  workflow_dispatch:
    inputs:
      dag_run_id:
        description: 'Airflow DAG Run ID'
        required: false
        default: 'manual'
  repository_dispatch:
    types: [dvc-commit]

env:
  PYTHON_VERSION: '3.10'
  DVC_REMOTE: 'gcs-remote'
  PROJECT_ID: 'rewardsense'
  WORKLOAD_IDENTITY_PROVIDER: 'projects/760934308287/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  SERVICE_ACCOUNT: 'rewardsense-pipeline@rewardsense.iam.gserviceaccount.com'

jobs:
  commit-dvc-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install DVC with GCS support
        run: pip install dvc dvc-gs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP Authentication
        run: |
          echo "Authenticated as:"
          gcloud auth list
          echo "Project:"
          gcloud config get-value project

      - name: Pull DVC tracked files
        run: |
          dvc pull --allow-missing || echo "DVC pull completed (some files may be missing)"

      - name: Check DVC status
        run: |
          echo "DVC Status:"
          dvc status
          echo ""
          echo "DVC-tracked files:"
          dvc list . --dvc-only -R || echo "No DVC files found"

      - name: Commit and push DVC files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all DVC-related files
          git add -A *.dvc dvc.lock .gitignore 2>/dev/null || true
          git add -A data/**/*.dvc 2>/dev/null || true
          
          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "✅ No DVC file changes to commit"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
            RUN_ID="${{ github.event.inputs.dag_run_id || github.event.client_payload.dag_run_id || 'push-triggered' }}"
            
            git commit -m "chore(data): auto-update DVC tracking files

Run ID: ${RUN_ID}
Timestamp: ${TIMESTAMP}
Triggered by: ${{ github.event_name }}

[skip ci]"
            git push
            echo "✅ DVC files committed and pushed"
          fi

      - name: Summary
        run: |
          echo "## DVC Version Commit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** ${{ github.event.inputs.dag_run_id || github.event.client_payload.dag_run_id || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **GCP Auth:** Workload Identity Federation" >> $GITHUB_STEP_SUMMARY
          echo "- **Service Account:** ${{ env.SERVICE_ACCOUNT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Complete ✅" >> $GITHUB_STEP_SUMMARY
